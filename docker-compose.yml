name: media-review-hub

services:
  # The entry point on :3000. Spreads requests over the web containers, so
  # `docker compose up --scale web=2` works (sessions live in Postgres and
  # realtime events in Redis: any instance can serve any request).
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports: ["3000:3000"]
    volumes: ["./docker/Caddyfile:/etc/caddy/Caddyfile:ro"]
    healthcheck:
      # Healthy once it can reach a healthy web instance.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      web: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    env_file: .env
    # tini as PID 1: forwards signals and reaps zombies.
    init: true
    restart: unless-stopped
    # No host port: reached through caddy (several instances can't share one).
    # Next finishes in-flight requests on SIGTERM; this bounds how long it may take.
    stop_grace_period: 30s
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    env_file: .env
    init: true
    restart: unless-stopped
    # Long enough for the active transcoding job to finish on `docker compose stop`.
    stop_grace_period: 2m
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      mailpit: { condition: service_healthy }

  migrate:
    build: { context: ., target: migrate }
    env_file: .env
    restart: "no"
    # One-shot: not attached to `up`'s output, so its normal exit doesn't stop
    # the stack under --abort-on-container-exit (the e2e run). Its logs are
    # still in `docker compose logs migrate`.
    attach: false
    depends_on:
      postgres: { condition: service_healthy }

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF so queued jobs survive a restart; noeviction as BullMQ requires.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # MinIO no longer publishes official images; Chainguard builds it from source.
    # Pinned by digest for reproducible builds.
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    restart: unless-stopped
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      # Browser uploads parts straight to MinIO, so it must allow our origin.
      MINIO_API_CORS_ALLOW_ORIGIN: ${APP_URL}
      # Server-wide replacement for an AbortIncompleteMultipartUpload rule.
      MINIO_API_STALE_UPLOADS_EXPIRY: 24h
      MINIO_API_STALE_UPLOADS_CLEANUP_INTERVAL: 1h
    ports: ["9000:9000"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio@sha256:2136d593beacf4461187035eca949fe49abd589d5079735025c711ca58fee0c8
    entrypoint: ["sh", "/minio-init.sh"]
    env_file: .env
    # One-shot, like migrate.
    attach: false
    volumes: ["./docker/minio-init.sh:/minio-init.sh:ro"]
    restart: "no"
    depends_on:
      minio: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:v1.31.6
    restart: unless-stopped
    ports: ["8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Playwright tests in a container against this stack:
  #   docker compose --profile e2e up --build --abort-on-container-exit --exit-code-from e2e
  e2e:
    profiles: [e2e]
    build: { context: ., target: e2e }
    environment:
      BASE_URL: http://localhost:3000
      MAILPIT_URL: http://mailpit:8025
      # The browser keeps using "localhost" (cookies, the CSRF Origin check and
      # presigned URL signatures all depend on it) but reaches caddy, which
      # serves the app on :3000 and MinIO on :9000.
      E2E_HOST_RULES: MAP localhost caddy
      CI: "1"
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: 1gb
    # Report and failure traces end up in ./e2e-results on the host.
    volumes: ["./e2e-results:/e2e/e2e-results"]
    depends_on:
      caddy: { condition: service_healthy }
      worker: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  minio-data:
